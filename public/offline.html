<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline | Hemant Kumar Jha</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Manrope:wght@400;500&display=swap" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #0a0a0d; color: #f3f3f6; font-family: 'Manrope', system-ui, sans-serif;
        padding: 20px; text-align: center;
      }
      .wrap { max-width: 420px; }
      /* An inline SVG rather than an <img>: a real offline page can't rely on
         a separate image request succeeding, since the browser is (by
         definition) not connected when this page is shown. */
      .badge {
        width: 92px; height: 92px; margin: 0 auto 22px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle, rgba(110,91,240,0.22), rgba(110,91,240,0.04) 70%);
        border: 1px solid rgba(110,91,240,0.3);
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(110,91,240,0.25); }
        50% { box-shadow: 0 0 0 14px rgba(110,91,240,0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .badge { animation: none; }
      }
      h1 { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 1.4rem; margin: 0 0 8px; }
      p { color: #98989f; font-size: 0.95rem; line-height: 1.6; margin: 0 0 28px; }
      .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      button, a.home-link {
        display: inline-flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer;
        font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 600; font-size: 0.9rem;
        border-radius: 12px; padding: 12px 22px; border: none;
      }
      button {
        color: #fff; background: #6e5bf0; box-shadow: 0 8px 24px rgba(110,91,240,0.35);
      }
      button:hover { background: #7f6ffb; }
      a.home-link {
        color: #f3f3f6; background: transparent; border: 1px solid rgba(255,255,255,0.14);
      }
      a.home-link:hover { border-color: #6e5bf0; color: #6e5bf0; }
      .status { font-size: 0.78rem; color: #6b6b73; margin-top: 22px; }
      .status strong { color: #98989f; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="badge" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a396ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="2" y1="2" x2="22" y2="22" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M5 12.9a10 10 0 0 1 5-2.7" />
          <path d="M19 12.9a10 10 0 0 0 -2.7 -2.9" />
          <path d="M1.4 8.4a15 15 0 0 1 4.1 -2.3" />
          <path d="M22.6 8.4a15 15 0 0 0 -6.1 -3.4" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>Can't reach the network right now. Check your connection — pages you've already visited may still work from cache.</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Try again</button>
        <a class="home-link" href="/">Back to home</a>
      </div>
      <p class="status" id="status"><strong>Status:</strong> waiting for connection…</p>
    </div>
    <script>
      // Auto-reload the moment the browser regains connectivity, so the
      // visitor doesn't have to notice and click "Try again" themselves.
      // Only the 'online' EVENT triggers this -- checking navigator.onLine
      // on initial load too would reload immediately whenever this page is
      // opened directly while already connected (e.g. testing it), which
      // is an infinite reload loop rather than a real offline recovery.
      window.addEventListener('online', function () {
        document.getElementById('status').innerHTML = '<strong>Back online</strong> — reloading…';
        location.reload();
      });
      if (navigator.onLine) {
        document.getElementById('status').innerHTML = '<strong>Status:</strong> connected';
      }
    </script>
  </body>
</html>
